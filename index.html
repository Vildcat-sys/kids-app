<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#FFFBF5">
<meta name="description" content="给 3 到 8 岁孩子的早教应用：生活科普、地理军事、人文科技、逻辑思维、空间思维、英语。完全离线可用。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小小百科">
<title>小小百科 · 给孩子的第一个百科</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./src/styles.css">
<link rel="stylesheet" href="./src/styles-kids.css">
</head>
<body>

<!-- 屏幕阅读器摘要。应用主体由 src/main.js 动态挂载。 -->
<h2 class="sr-only">小小百科，包含生活科普、地理军事、人文科技、逻辑思维、空间思维、英语六个领域，每个知识点配有插画、知识卡、语音朗读与互动练习。</h2>

<!--
  入口说明：
  1. 本项目使用原生 ES Module，**必须通过 http 服务打开**。
     直接双击本文件（file:// 协议）会被浏览器以 CORS 策略拦截，页面空白。
     本地预览： python -m http.server 8765
  2. 没有构建步骤，改完源码刷新即可生效。
-->
<script type="module" src="./src/main.js"></script>

<!-- 模块加载失败时的兜底提示，避免用户只看到白屏 -->
<noscript>
  <p style="padding:24px;font:16px/1.7 system-ui,sans-serif;color:#2D2A26">
    这个应用需要开启 JavaScript 才能运行。
  </p>
</noscript>
<script>
  window.addEventListener('error', function (e) {
    if (document.querySelector('.app-header')) return;
    document.body.insertAdjacentHTML('afterbegin',
      '<div style="padding:24px;font:15px/1.8 system-ui,sans-serif;color:#8E3A2C;background:#FDF2F0;border-radius:16px;margin:24px">' +
      '<strong>页面没能加载。</strong><br>' +
      '如果你是用双击文件的方式打开的，请改用本地服务：在项目目录执行 ' +
      '<code>python -m http.server 8765</code>，然后访问 http://127.0.0.1:8765<br>' +
      '错误信息：' + (e.message || '未知') +
      '</div>');
  });
</script>

</body>
</html>
