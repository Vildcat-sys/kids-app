<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>交互测试</title>
<style>
  body{margin:0;padding:12px;font:12px/1.6 ui-monospace,Consolas,monospace;background:#fff}
  iframe{width:820px;height:900px;border:2px solid #d33;display:block;margin-bottom:10px}
  #log{white-space:pre-wrap;background:#f5f5f5;padding:10px;border-radius:6px}
</style>
</head>
<body>
<iframe id="f" src="../index.html#/e/elephant"></iframe>
<div id="log">running…</div>
<script>
const f = document.getElementById('f');
const el = document.getElementById('log');
let buf = '';
const log = m => { buf += m + '\n'; el.textContent = buf; };

f.addEventListener('load', () => setTimeout(() => {
  const d = f.contentDocument, w = f.contentWindow;

  log('1. 详情页渲染: ' + (d.querySelector('.hero') ? 'OK' : 'FAIL'));
  log('   标题 = ' + (d.querySelector('.hero-txt h2') || {}).textContent);
  log('   事实条数 = ' + d.querySelectorAll('.fact').length);

  const quizBtn = d.querySelector('[data-quiz]');
  log('2. 考一考按钮: ' + (quizBtn ? 'OK' : 'FAIL'));
  if (quizBtn) quizBtn.click();

  setTimeout(() => {
    const opts = d.querySelectorAll('.opt');
    log('3. 答题浮层选项数 = ' + opts.length);
    const q = d.querySelector('.qhead h3');
    log('   题目 = ' + (q ? q.textContent : 'n/a'));

    if (opts.length >= 3) {
      log('4. 点击正确选项 C …');
      opts[2].click();

      setTimeout(() => {
        const v = d.querySelector('.verdict');
        log('5. 反馈区 class = ' + (v ? v.className : 'n/a'));
        log('   反馈文字 = ' + (v ? v.textContent.slice(0, 70) : 'n/a'));
        log('   标记为正确的选项数 = ' + d.querySelectorAll('.opt.right').length);
        log('   标记为错误的选项数 = ' + d.querySelectorAll('.opt.wrong').length);
        log('6. 星星计数 = ' + (d.querySelector('#starsTxt') || {}).textContent);
        log('7. localStorage 进度 = ' + w.localStorage.getItem('kids-encyclopedia-progress-v1'));
        log('8. 返回首页按钮 = ' + (d.querySelector('#qacts [data-home]') ? 'OK' : 'FAIL'));

        const hb = d.querySelector('#qacts [data-home]');
        if (hb) hb.click();
        setTimeout(() => {
          log('9. 回到首页卡片数 = ' + d.querySelectorAll('.card').length);
          log('   已学会卡片数 = ' + d.querySelectorAll('.card.done').length);
          log('   顶栏 = ' + (d.querySelector('#starsTxt') || {}).textContent);
          log('--- 全部完成 ---');
        }, 300);
      }, 400);
    }
  }, 350);
}, 600));
</script>
</body>
</html>
