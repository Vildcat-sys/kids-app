distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 用 bin 版而非 all 版：all 版多出的两万多个文件全是源码与 javadoc，构建用不到。
#   实测条目数  all 27271 / bin 323  —— 相差 84 倍，解压耗时天差地别。
#   体积        all 224MB  / bin 131MB
# 走腾讯云镜像：官方 services.gradle.org 实测 13 分钟只下 40MB 且会断连，
# 腾讯云镜像实测 32 MB/s（131MB 用 4 秒）。
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.14.3-bin.zip
# 官方源兜底（若镜像不可用可临时切回）：
# distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-bin.zip
# 10s 在弱网下偏紧，容易在下载途中被掐断；放宽到 60s
networkTimeout=60000
validateDistributionUrl=false
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
